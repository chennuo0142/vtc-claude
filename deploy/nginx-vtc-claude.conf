# Référence pour l'installation manuelle sur le serveur :
#   sudo cp deploy/nginx-vtc-claude.conf /etc/nginx/sites-available/vtc-claude
#   sudo ln -sf /etc/nginx/sites-available/vtc-claude /etc/nginx/sites-enabled/vtc-claude
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note : les autres apps du serveur partagent déjà `server_name 192.168.0.137`,
# donc une seule d'entre elles répond réellement sur le port 80 à la fois.
# L'accès fiable pour cette app reste http://192.168.0.137:3003.

server {
    listen 80;
    server_name 192.168.0.137;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
